name: Frontend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "reactapp/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "reactapp/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reactapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reactapp/package-lock.json

      - run: npm ci

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Verify production API URL
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: test -n "$REACT_APP_API_BASE_URL"
        env:
          REACT_APP_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Build frontend
        run: npm run build
        env:
          CI: true
          REACT_APP_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: reactapp/build
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: build

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.FRONTEND_APP_NAME }}
          publish-profile: ${{ secrets.FRONTEND_PUBLISH_PROFILE }}
          package: build
